# postgresql.conf dùng chung cho pg-hq, pg-dc1, pg-dc2, pg-dc3 (spec F3).
# Nạp bằng: postgres -c config_file=/etc/postgresql/postgresql.conf

listen_addresses = '*'          # F2: kho nhận FDW/Debezium từ máy A, HQ nhận subscription từ máy B
port = 5432                      # trong container; compose ánh xạ 5432..5435 theo F2
hba_file = '/etc/postgresql/pg_hba.conf'

# F3
wal_level = logical
max_replication_slots = 10
max_wal_senders = 10
max_slot_wal_keep_size = 2GB    # chặn đầy đĩa khi connector hoặc kho dừng lâu

password_encryption = scram-sha-256
timezone = 'UTC'
log_timezone = 'UTC'
