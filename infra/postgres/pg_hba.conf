# pg_hba.conf dùng chung cho 4 CSDL (spec F2, F3).
# TYPE  DATABASE     USER  ADDRESS  METHOD

# Socket trong container: script khởi tạo (docker-entrypoint-initdb.d) và docker exec psql.
local   all          all            trust

# Qua mạng: bắt buộc mật khẩu.
# F2 yêu cầu pg-dc cho phép HOST_A_IP (FDW, Debezium) và pg-hq cho phép HOST_B_IP (subscription).
# Với Docker Desktop, kết nối qua cổng publish đi qua NAT nên địa chỉ nguồn là IP gateway của Docker,
# không phải HOST_A_IP/HOST_B_IP; vì vậy mở mọi địa chỉ và dựa vào mật khẩu (xem infra/README.md).
host    all          all   all      scram-sha-256
host    replication  all   all      scram-sha-256
