# Máy A (HQ) – spec F1, F2. Chạy từ gốc repo: make up-hq
#   docker compose --env-file .env -f infra/compose.hq.yml up -d --build
# Biến lấy từ .env ở gốc repo: HOST_A_IP, HOST_B_IP, INTERNAL_KEY, POSTGRES_PASSWORD.
name: btl-hq

services:
  pg-hq:
    image: postgres:16
    container_name: pg-hq
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thieu POSTGRES_PASSWORD trong .env}
    ports:
      - "5432:5432"
    volumes:
      - pg-hq-data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init-hq.sh:/docker-entrypoint-initdb.d/10-init-hq.sh:ro
      - ../db/migrations:/migrations:ro
    healthcheck:
      # -h localhost: lúc initdb máy chủ tạm chỉ nghe socket, nên chỉ healthy khi khởi tạo xong
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "hq_db"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.1
    container_name: kafka
    environment:
      # KRaft, 1 broker, replication factor 1 (F1)
      CLUSTER_ID: btl-kho-phan-tan-kraft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT kafka:9092 cho các container; EXTERNAL :29092 cho công cụ chạy trên máy host
      # (pytest, bench-cdc) – F2.
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${HOST_A_IP:?Thieu HOST_A_IP trong .env}:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3 # F8: topic outbox.event.* có 3 partition (topic tự tạo lấy giá trị này)
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  kafka-connect:
    image: quay.io/debezium/connect:2.7.3.Final
    container_name: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: kafka-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connector-plugins > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: hq
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: kafka-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    ports:
      - "8080:8080"
    restart: unless-stopped

  hq-api:
    build:
      context: ..
      dockerfile: hq-api/Dockerfile
    image: btl/hq-api
    container_name: hq-api
    depends_on:
      pg-hq:
        condition: service_healthy
    environment:
      HOST_A_IP: ${HOST_A_IP:?Thieu HOST_A_IP trong .env}
      HOST_B_IP: ${HOST_B_IP:?Thieu HOST_B_IP trong .env}
      INTERNAL_KEY: ${INTERNAL_KEY:?Thieu INTERNAL_KEY trong .env}
      HQ_DB_URL: postgresql://hq_app:${POSTGRES_PASSWORD}@pg-hq:5432/hq_db
      NODE_URLS: '{"1": "http://${HOST_B_IP}:8001", "2": "http://${HOST_B_IP}:8002", "3": "http://${HOST_B_IP}:8003"}'
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8000:8000"
    restart: unless-stopped

  # TODO(hq-consumer): thêm service hq-consumer (F2: không mở cổng; HQ_DB_URL, NODE_URLS,
  # KAFKA_BOOTSTRAP=kafka:9092) khi consumer/ có code và Dockerfile.

  dashboard:
    image: nginx:1.27-alpine
    container_name: dashboard
    entrypoint: ["/bin/sh", "/opt/gen-config.sh"]
    environment:
      HQ_URL: http://${HOST_A_IP}:8000
    ports:
      - "3000:80"
    volumes:
      - ../dashboard:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/gen-config.sh:/opt/gen-config.sh:ro
    restart: unless-stopped

volumes:
  pg-hq-data:
  kafka-data:
