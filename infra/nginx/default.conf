# nginx cho dashboard và wms: phục vụ file tĩnh; config.js sinh lúc khởi động (gen-config.sh).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /config.js {
        alias /etc/nginx/runtime/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
