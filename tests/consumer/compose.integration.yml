# Isolated verification stack. No host ports or production volumes.
name: btl-chung-tests
x-postgres: &postgres
  image: postgres:16
  command: [postgres, -c, wal_level=logical, -c, max_replication_slots=10, -c, max_wal_senders=10]
  volumes:
    - ../../db/migrations:/migrations:ro
    - ./init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
  healthcheck:
    test: [CMD-SHELL, 'pg_isready -h localhost -U postgres -d "$${POSTGRES_DB}"']
    interval: 1s
    timeout: 2s
    retries: 60
services:
  chung-runner:
    profiles: [validation]
    build:
      context: ../..
      dockerfile: tests/consumer/Dockerfile
    image: btl/chung-tests
    working_dir: /workspace
    environment:
      HQ_DB_URL: postgresql://hq_app:chungtest@chung-hq:5432/hq_db
      KAFKA_BOOTSTRAP: chung-kafka:9092
    volumes:
      - ../..:/workspace
    command: [sh, tests/consumer/run-tests.sh]
  chung-api:
    profiles: [preview]
    image: btl/chung-tests
    working_dir: /workspace/hq-api
    volumes:
      - ../..:/workspace
    environment:
      PYTHONPATH: /workspace
      INTERNAL_KEY: chungtest
      HQ_DB_URL: postgresql://hq_app:chungtest@chung-hq:5432/hq_db
      NODE_URLS: '{"1":"http://chung-dc1:8001","2":"http://chung-dc2:8002","3":"http://chung-dc3:8003"}'
    command: [uvicorn, main:app, --host, 0.0.0.0, --port, '8000']
  chung-dashboard:
    profiles: [preview]
    image: nginx:1.27-alpine
    depends_on: [chung-api]
    entrypoint: [/bin/sh, /opt/gen-config.sh]
    environment:
      HQ_URL: /api
    ports: ['127.0.0.1:13000:80']
    volumes:
      - ../../dashboard:/usr/share/nginx/html:ro
      - ./nginx-preview.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../infra/nginx/gen-config.sh:/opt/gen-config.sh:ro
  chung-connect:
    image: quay.io/debezium/connect:2.7.3.Final
    depends_on:
      chung-kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: chung-kafka:9092
      GROUP_ID: kafka-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    healthcheck:
      test: [CMD-SHELL, curl -sf http://localhost:8083/connector-plugins > /dev/null]
      interval: 3s
      timeout: 5s
      retries: 60
  chung-hq:
    <<: *postgres
    environment:
      POSTGRES_PASSWORD: chungtest
      POSTGRES_DB: hq_db
  chung-dc1:
    <<: *postgres
    environment:
      POSTGRES_PASSWORD: chungtest
      POSTGRES_DB: dc1
      DC_ID: 1
  chung-dc2:
    <<: *postgres
    ports: ['127.0.0.1:15434:5432']
    environment:
      POSTGRES_PASSWORD: chungtest
      POSTGRES_DB: dc2
      DC_ID: 2
  chung-dc3:
    <<: *postgres
    environment:
      POSTGRES_PASSWORD: chungtest
      POSTGRES_DB: dc3
      DC_ID: 3
  chung-kafka:
    image: apache/kafka:3.8.1
    environment:
      CLUSTER_ID: chung-cdc-test-kraft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://chung-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@chung-kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server chung-kafka:9092 --list]
      interval: 3s
      timeout: 10s
      retries: 30
