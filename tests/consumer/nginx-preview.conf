server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location = /config.js {
        alias /etc/nginx/runtime/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }
    location /api/ { proxy_pass http://chung-api:8000/; }
    location / { try_files $uri $uri/ =404; }
}
