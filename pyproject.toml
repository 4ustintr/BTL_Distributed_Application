# Chỉ dùng cho cấu hình công cụ; dependency nằm trong requirements*.txt
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: cần container thật, HQ và kho cùng một máy (HOST_A_IP = HOST_B_IP); không chạy trong CI",
  "optional: test tùy chọn trong docs/tests.md",
]
